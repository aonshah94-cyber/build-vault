<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Vault</title>
<meta name="description" content="Your personal vault of prompts, videos, links and outputs for building websites, apps and agents with Claude.">
<meta name="theme-color" content="#FFF8F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1625" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Build Vault">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#FFF8F0; --card:#FFFFFF; --line:#EEE1D2; --ink:#2B2240; --muted:#62597A; --soft:#F6ECE0;
  --acc:#B9431D; --acc-ink:#FFFFFF; --danger:#A8261B; --shadow:0 1px 2px rgba(43,34,64,.05),0 6px 18px rgba(43,34,64,.06);
  --backdrop:rgba(30,20,40,.45); --circle:#FFFFFF;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1B1625; --card:#262033; --line:#3B3249; --ink:#F6EFE6; --muted:#C2B8D0; --soft:#2F283D;
    --acc:#F0997B; --acc-ink:#2A0F05; --danger:#F7A399; --shadow:none; --backdrop:rgba(0,0,0,.6); --circle:rgba(255,255,255,.14); }
}
.c-coral{--f:#F5C4B3;--i:#4A1B0C;--s:#B03F1A;--si:#fff}
.c-teal{--f:#9FE1CB;--i:#04342C;--s:#0F6E56;--si:#fff}
.c-purple{--f:#CECBF6;--i:#26215C;--s:#534AB7;--si:#fff}
.c-amber{--f:#FAC775;--i:#412402;--s:#7E4A07;--si:#fff}
.c-pink{--f:#F4C0D1;--i:#4B1528;--s:#A3385D;--si:#fff}
.c-green{--f:#C0DD97;--i:#173404;--s:#3B6D11;--si:#fff}
@media (prefers-color-scheme:dark){
  .c-coral{--f:#712B13;--i:#FAECE7;--s:#F0997B;--si:#2A0F05}
  .c-teal{--f:#085041;--i:#E1F5EE;--s:#5DCAA5;--si:#04342C}
  .c-purple{--f:#3C3489;--i:#EEEDFE;--s:#AFA9EC;--si:#26215C}
  .c-amber{--f:#633806;--i:#FAEEDA;--s:#EF9F27;--si:#412402}
  .c-pink{--f:#72243E;--i:#FBEAF0;--s:#ED93B1;--si:#4B1528}
  .c-green{--f:#27500A;--i:#EAF3DE;--s:#97C459;--si:#173404}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.top{padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.top h1{font-size:28px;line-height:1.15;margin:4px 0 12px;font-weight:700;letter-spacing:-.01em}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:46px}
.search .ic{color:var(--muted)}
.search input{flex:1;border:0;background:transparent;outline:none;min-height:44px;font-size:16px}
.search input::placeholder{color:var(--muted)}
.wrap{padding:6px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:20px;background:var(--f);color:var(--i);text-decoration:none;min-height:112px;border:0;text-align:left}
.tile .circ{width:40px;height:40px;border-radius:50%;background:var(--circle);display:flex;align-items:center;justify-content:center;color:var(--s)}
@media (prefers-color-scheme:dark){.tile .circ{color:var(--i)}}
.tile b{font-size:17px;font-weight:650;line-height:1.2}
.tile span{font-size:14px}
.tile.new{background:transparent;border:2px dashed var(--line);color:var(--muted);align-items:center;justify-content:center;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.welcome{padding:14px 16px;margin-bottom:14px}
.welcome h2{margin:0 0 6px;font-size:18px}
.welcome ol{margin:0 0 10px;padding-left:20px;color:var(--muted)}
.welcome li{margin:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:16px;text-decoration:none}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:12px}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.s{background:var(--s);border-color:var(--s);color:var(--si)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.block{display:flex;width:100%}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.band{background:var(--f);color:var(--i);padding:calc(10px + env(safe-area-inset-top)) 16px 12px;border-radius:0 0 24px 24px;margin-bottom:10px}
.band.plain{background:transparent;color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;text-decoration:none;font-weight:600;margin-left:-6px;padding-right:10px}
.band-h{display:flex;align-items:center;gap:10px}
.band-h h1{flex:1;font-size:26px;line-height:1.15;margin:2px 0 10px;font-weight:700;word-break:break-word}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--circle);display:inline-flex;align-items:center;justify-content:center;color:inherit;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.band .chip{border-color:transparent;background:var(--circle);color:var(--i)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.band .chip[aria-pressed="true"]{background:var(--s);color:var(--si)}
.chip .n{opacity:.8;font-weight:500}
.chip.col{background:var(--f);color:var(--i);border-color:var(--f)}
.chip.col[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.glabel{font-size:14px;font-weight:700;color:var(--muted);margin:16px 2px 8px;text-transform:none}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 0}
.item-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:6px 4px 6px 12px;min-height:56px;border-radius:14px}
.item .t{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.item .txt{min-width:0;flex:1}
.thumb{position:relative;width:52px;height:52px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;color:var(--muted)}
.thumb.wide{width:84px;height:52px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img.fav{inset:14px;width:24px;height:24px;object-fit:contain}
.thumb.yt{color:#C4302B}.thumb.ig{color:#C13584}.thumb.gd{color:#1A73E8}.thumb.gs{color:#188038}.thumb.gp{color:#B06000}
@media (prefers-color-scheme:dark){.thumb.yt{color:#FF8A80}.thumb.ig{color:#F48FB1}.thumb.gd{color:#8AB4F8}.thumb.gs{color:#81C995}.thumb.gp{color:#FDD663}}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);margin-right:6px;vertical-align:1px}
.empty{text-align:center;padding:28px 18px}
.empty p{color:var(--muted);margin:0 0 14px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:8px;min-height:56px;padding:0 28px;border-radius:999px;border:0;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:18px;box-shadow:0 6px 20px rgba(185,67,29,.35)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:19;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:flex;width:100%;max-width:600px}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;justify-content:center;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;position:relative}
.tabs a[aria-current="page"]{color:var(--acc)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--acc);color:var(--acc-ink);border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--backdrop);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh-h h2{flex:1;font-size:21px;margin:0;line-height:1.2;word-break:break-word}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:92px;padding:14px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);font-weight:650;font-size:17px;text-align:left}
.kind .ic{width:28px;height:28px}
.kind small{font-weight:500;font-size:13px;color:var(--muted)}
.where{display:flex;flex-direction:column;gap:8px}
.wbtn{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:16px;border:0;background:var(--f,var(--card));color:var(--i,var(--ink));font-weight:650;font-size:17px;text-align:left}
.wbtn.plain{background:var(--card);border:1.5px solid var(--line)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--s);flex:none}
.field{margin:0 0 14px}
.field>label,.field>.lab{display:block;font-weight:650;font-size:15px;margin:0 0 6px}
.field .hint{font-size:13px;color:var(--muted);margin-top:6px}
.inp{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:130px;resize:vertical;line-height:1.45}
textarea.inp.big{min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px}
.inrow{display:flex;gap:8px}
.inrow .inp{flex:1}
.err{color:var(--danger);font-size:14px;font-weight:600;margin-top:6px}
.detect{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:8px}
.sticky{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 calc(6px + env(safe-area-inset-bottom));margin-top:8px}
.prompt-view{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:40vh;overflow:auto;margin:0 0 14px}
mark{background:#FAC775;color:#412402;border-radius:4px;padding:0 2px}
.bigthumb{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--soft);margin-bottom:12px;position:relative}
.bigthumb img{width:100%;height:100%;object-fit:cover;display:block}
.url{font-size:14px;color:var(--muted);word-break:break-all;margin:0 0 12px}
.why{background:var(--soft);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.shot{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft);border:0;padding:0}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.pblock{padding:14px;margin-bottom:12px}
.pblock h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.pblock .list{gap:6px;margin-bottom:10px}
.pblock .item{border:1px solid var(--line);border-radius:14px;box-shadow:none}
.mini{font-size:14px;color:var(--muted);margin:0 0 10px}
.typebadge{display:inline-flex;align-items:center;gap:6px;background:var(--f);color:var(--i);border-radius:999px;padding:4px 12px;font-weight:650;font-size:14px;margin-bottom:12px}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(146px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{pointer-events:auto;border:0;background:transparent;color:var(--bg);font-weight:800;min-height:40px;padding:0 10px;text-decoration:underline}
.banner{margin:0 16px 10px;padding:10px 14px;border-radius:14px;background:#FCEBEB;color:#791F1F;font-weight:600;font-size:14px}
.backup{padding:14px;margin-top:22px}
.backup h2{font-size:17px;margin:0 0 4px}
.viewer img{width:100%;border-radius:14px;display:block;margin-bottom:12px}
.pick{display:flex;align-items:center;gap:10px;min-height:56px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px;text-align:left;width:100%}
.pick[aria-pressed="true"]{border-color:var(--acc);background:var(--soft)}
.pick .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--acc-ink)}
.pick[aria-pressed="true"] .chk{background:var(--acc);border-color:var(--acc)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid transparent;background:var(--f)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.saved{font-size:13px;color:var(--muted);height:18px;margin-top:4px}
</style>
</head>
<body>
<div id="app" aria-live="off"></div>
<div id="sheet-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Build Vault needs JavaScript turned on.</p></noscript>

/* ---------- Storage (IndexedDB, every call wrapped) ---------- */
const DB = (() => {
  let dbp = null;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('build-vault', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
          if (!d.objectStoreNames.contains('files')) d.createObjectStore('files');
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('Storage is blocked'));
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      try {
        const t = d.transaction(store, mode);
        const req = fn(t.objectStore(store));
        let out;
        if (req) req.onsuccess = () => { out = req.result; };
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  }
  return {
    get: (s, k) => tx(s, 'readonly', st => st.get(k)),
    put: (s, k, v) => tx(s, 'readwrite', st => st.put(v, k)),
    del: (s, k) => tx(s, 'readwrite', st => st.delete(k)),
    keys: s => tx(s, 'readonly', st => st.getAllKeys()),
    clear: s => tx(s, 'readwrite', st => st.clear())
  };
})();

/* ---------- Links: detect type, thumbnail, best way to open ---------- */
function normUrl(raw) {
  let u = String(raw || '').trim();
  if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u) && /^[^\s]+\.[^\s]{2,}/.test(u)) u = 'https://' + u;
  return u;
}
function validUrl(u) { try { const x = new URL(u); return x.protocol === 'http:' || x.protocol === 'https:'; } catch (e) { return false; } }
function igMediaId(code) {
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  try { let id = BigInt(0); for (const ch of code.slice(0, 11)) { const v = A.indexOf(ch); if (v < 0) return null; id = id * BigInt(64) + BigInt(v); } return id.toString(); } catch (e) { return null; }
}
function linkInfo(raw) {
  const url = normUrl(raw);
  let u; try { u = new URL(url); } catch (e) { return { type:'web', label:'Link', icon:'link', cls:'', url }; }
  const host = u.hostname.toLowerCase().replace(/^(www|m)\./, '');
  const strip = url.replace(/^https?:\/\//i, '');
  if (host === 'youtu.be' || host.endsWith('youtube.com') || host === 'youtube-nocookie.com') {
    let id = '';
    if (host === 'youtu.be') id = u.pathname.split('/')[1] || '';
    else if (u.searchParams.get('v')) id = u.searchParams.get('v');
    else { const m = u.pathname.match(/^\/(shorts|live|embed|v)\/([\w-]{6,})/); if (m) id = m[2]; }
    id = (id.match(/^[\w-]{6,}/) || [''])[0];
    return { type:'youtube', label:'YouTube', icon:'play', cls:'yt', url, ytId:id,
      thumb: id ? 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg' : '',
      app: id ? 'youtube://www.youtube.com/watch?v=' + id : 'youtube://' + strip };
  }
  if (host === 'instagram.com' || host.endsWith('.instagram.com') || host === 'instagr.am') {
    const parts = u.pathname.split('/').filter(Boolean);
    let app = '';
    if (['p','reel','reels','tv'].includes(parts[0]) && parts[1]) { const mid = igMediaId(parts[1]); if (mid) app = 'instagram://media?id=' + mid; }
    else if (parts.length === 1 && !['explore','stories','accounts','direct'].includes(parts[0])) app = 'instagram://user?username=' + encodeURIComponent(parts[0]);
    return { type:'instagram', label:'Instagram', icon:'instagram', cls:'ig', url, app };
  }
  if (host === 'docs.google.com') {
    const p = u.pathname;
    if (p.startsWith('/spreadsheets')) return { type:'gsheet', label:'Google Sheet', icon:'sheet', cls:'gs', url, app:'googlesheets://' + strip };
    if (p.startsWith('/presentation')) return { type:'gslides', label:'Google Slides', icon:'slides', cls:'gp', url, app:'googleslides://' + strip };
    if (p.startsWith('/forms')) return { type:'gform', label:'Google Form', icon:'doc', cls:'gd', url, app:'' };
    return { type:'gdoc', label:'Google Doc', icon:'doc', cls:'gd', url, app:'googledocs://' + strip };
  }
  if (host === 'drive.google.com') return { type:'gdrive', label:'Google Drive', icon:'drive', cls:'gs', url, app:'googledrive://' + strip };
  return { type:'web', label: host || 'Website', icon:'world', cls:'', url, host: u.hostname,
    fav: u.origin + '/favicon.ico' };
}
function bvNavigate(u) { window.location.href = u; }
function openUrl(raw, forceBrowser) {
  const info = linkInfo(raw);
  if (!validUrl(info.url)) { toast("That link doesn't look right. Edit it to fix."); return; }
  if (isIOS && info.app && !forceBrowser) {
    // Try the app first; if it isn't installed, fall back to the browser.
    let left = false;
    const onVis = () => { if (document.hidden) left = true; };
    document.addEventListener('visibilitychange', onVis);
    bvNavigate(info.app);
    setTimeout(() => {
      document.removeEventListener('visibilitychange', onVis);
      if (!left && !document.hidden) bvNavigate(info.url);
    }, 1600);
    return;
  }
  const w = window.open(info.url, '_blank', 'noopener');
  if (!w && !isMobile) bvNavigate(info.url);
}

/* ---------- Prompts: {{blanks}} ---------- */
function blanksOf(text) {
  const out = [];
  String(text || '').replace(BLANK_RE, (m, n) => { if (!out.includes(n)) out.push(n); return m; });
  return out;
}

}

    }

}

  ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);

}

  if (project) names.forEach(n => { if (isProjectBlank(n)) pre[n] = project.name; });
  const missing = names.filter(n => !(n in pre));
  if (!missing.length) {

/* ---------- Routing ---------- */
function route() {
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean).map(decodeURIComponent);
  if (parts[0] === 's' && parts[1]) return { tab:'vault', view:'section', id:parts[1] };
  if (parts[0] === 'p' && parts[1]) return { tab:'projects', view:'project', id:parts[1] };
  if (parts[0] === 'projects') return { tab:'projects', view:'projects' };
  if (parts[0] === 'inbox') return { tab:'inbox', view:'inbox' };
  return { tab:'vault', view:'home' };
}

  if (!S) return;

  let html = '';
  if (r.view === 'section') { const s = sec(r.id); if (!s) { location.replace('#/'); return; } html = sectionPage(s); }
  else if (r.view === 'project') { const p = proj(r.id); if (!p) { location.replace('#/projects'); return; } html = projectPage(p); }
  else html = rootPage(r);

    html +
    '<button type="button" class="fab" data-act="add">' + ic('plus') + 'Add</button>' + tabbar(r.tab);
  hydrate(app);
  ui.lastRoute = key;
  window.scrollTo(0, sameRoute ? y : 0);
}

    if (editing && it.prevText != null) f += '<button type="button" class="btn block" data-act="undo-version" data-id="' + it.id + '" style="margin-bottom:12px">' + ic('undo') + 'Undo to previous version</button>';
  } else if (kind === 'video' || kind === 'link') {
    f += urlField(it.url, kind === 'video' ? 'Video link' : 'Link') + '<div class="err" id="err-url" hidden></div>' +

  } else if (kind === 'note') {

  } else if (kind === 'output') {
    f += '<div class="field"><label for="f-title">Name</label><input id="f-title" class="inp" placeholder="Homepage v2" value="' + esc(it.title || '') + '"><div class="err" id="err-out" hidden></div></div>' +
      '<div class="field"><span class="lab">Screenshots or images</span><div class="shots" id="shots"></div>' +

      urlField(it.url, 'Link (optional)') +
      '<div class="field"><label for="f-why">Note <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="f-why" class="inp" placeholder="What made this good" value="' + esc(it.why || '') + '"></div>';
  }
  f += '<div class="sticky"><button type="button" class="btn p block" data-act="save-item">' + ic('check') + (editing ? 'Save changes' : 'Save') + '</button></div>';
  openSheet((editing ? 'Edit ' : 'New ') + KINDS[kind].label.toLowerCase(), f, {
    back: editing ? null : 'back-where',
    focus: kind === 'output' ? '#f-title' : (kind === 'video' || kind === 'link') ? '#f-url' : '#f-text',
    mount: root => {
      addCtx.label = it.label || '';
      const u = $('#f-url', root);
      if (u) { const upd = () => { $('#detect', root).innerHTML = detectHtml(u.value); }; u.addEventListener('input', upd); upd(); }
      const ff = $('#f-files', root);
      if (ff) ff.addEventListener('change', async () => {
        const files = Array.from(ff.files || []);
        for (const file of files) {
          try { const d = await resizeImage(file); const id = await storeFile(d); addCtx.files.push(id); }
          catch (e) { toast('Couldn’t add one of the images.'); }
        }
        ff.value = ''; renderShots();
      });
      renderShots();
    }
  });
}
function renderShots() {
  const box = $('#shots'); if (!box) return;
  box.innerHTML = addCtx.files.map((id, n) => '<div class="shot"><img alt="Image ' + (n + 1) + '" data-file="' + esc(id) + '"><button type="button" class="x" data-act="rm-shot" data-n="' + n + '" aria-label="Remove image ' + (n + 1) + '">' + ic('x') + '</button></div>').join('');
  box.style.display = addCtx.files.length ? '' : 'none';
  hydrate(box);
}
function resizeImage(file, max, q) {
  max = max || 1600; q = q || 0.85;
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function showErr(id, msg) { const e = $('#' + id); if (e) { e.textContent = msg; e.hidden = false; } }
function saveItem() {
  const kind = addCtx.kind;
  const v = id => { const e = $('#' + id); return e ? e.value : ''; };
  const data = { kind, place:addCtx.place };
  $$('.err').forEach(e => { e.hidden = true; });
  if (kind === 'prompt' || kind === 'note') {
    const text = v('f-text');
    if (!text.trim()) { showErr('err-text', kind === 'prompt' ? 'Paste or type the prompt first.' : 'Write something first.'); $('#f-text').focus(); return; }
    data.text = text; data.title = v('f-title').trim();
    if (kind === 'prompt') data.label = addCtx.label || '';
  } else if (kind === 'video' || kind === 'link') {
    const url = normUrl(v('f-url'));
    if (!validUrl(url)) { showErr('err-url', 'Paste a full link, like https://youtube.com/…'); $('#f-url').focus(); return; }
    data.url = url; data.title = v('f-title').trim(); data.why = v('f-why').trim();
  } else if (kind === 'output') {
    const url = normUrl(v('f-url'));
    data.title = v('f-title').trim(); data.why = v('f-why').trim(); data.files = addCtx.files.slice();
    if (url && !validUrl(url)) { showErr('err-out', 'That link doesn’t look right.'); return; }
    data.url = url;
    if (!data.title && !url && !data.files.length) { showErr('err-out', 'Give it a name, a link or an image.'); $('#f-title').focus(); return; }
  }
  if (addCtx.editing) {
    const it = item(addCtx.editing);
    if (it) {
      if (kind === 'prompt' && it.text !== data.text) it.prevText = it.text;
      Object.assign(it, data, { updated:now() });
    }
    save(); closeSheet(); render(); toast('Saved');
    return;
  }
  const it = Object.assign({ id:uid(), created:now(), updated:now() }, data);
  S.items.push(it);
  let msg = 'Saved to ' + placeName(it.place);
  if (addCtx.linkTo) { const p = proj(addCtx.linkTo); if (p) { p.linked = (p.linked || []).concat(it.id); msg += ' and linked to ' + p.name; } }
  save(); closeSheet(); render(); toast(msg);
}

  addCtx = { kind:'project', editing: existing ? p.id : null, type:p.type, status:p.status };
  openSheet(existing ? 'Edit project' : 'New project',
    '<div class="field"><label for="f-name">Project name</label><input id="f-name" class="inp" placeholder="Bakery website" value="' + esc(p.name) + '"><div class="err" id="err-name" hidden></div></div>' +
    '<div class="field"><span class="lab" id="lab-type">What is it?</span><div class="chips" style="flex-wrap:wrap" role="group" aria-labelledby="lab-type">' +
      S.sections.map(s => '<button type="button" class="chip col c-' + s.color + '" data-act="form-type" data-v="' + esc(s.id) + '" aria-pressed="' + (p.type === s.id) + '">' + esc(s.name) + '</button>').join('') + '</div></div>' +
    '<div class="field"><span class="lab" id="lab-st">Stage</span><div class="seg" role="group" aria-labelledby="lab-st">' + STATUSES.map(([k, l]) => '<button type="button" data-act="form-status" data-v="' + k + '" aria-pressed="' + (p.status === k) + '">' + (k === 'idea' ? 'Idea' : l) + '</button>').join('') + '</div></div>' +
    '<div class="sticky">' + (existing ? '<button type="button" class="btn danger block" data-act="delete-project" data-id="' + p.id + '" style="margin-bottom:10px">' + ic('trash') + 'Delete project</button>' : '') +
    '<button type="button" class="btn p block" data-act="save-project">' + ic('check') + (existing ? 'Save changes' : 'Create project') + '</button></div>',
    { back: existing ? null : 'add', focus:'#f-name' });
}
function saveProject() {
  const name = $('#f-name').value.trim();
  if (!name) { showErr('err-name', 'Give your project a name.'); $('#f-name').focus(); return; }
  if (addCtx.editing) {
    const p = proj(addCtx.editing);
    Object.assign(p, { name, type:addCtx.type, status:addCtx.status, updated:now() });
    ui.projStatus = p.status; save(); closeSheet(); render(); toast('Saved');
    return;
  }
  const p = { id:uid(), name, type:addCtx.type, status:addCtx.status, notes:'', linked:[], created:now(), updated:now() };
  S.projects.push(p); ui.projStatus = p.status;
  save(); closeSheet(); go('#/p/' + encodeURIComponent(p.id)); toast('Project created');
}

/* Item details */
function detailSheet(it, project) {
  const K = KINDS[it.kind];
  let b = '<p class="mini">' + esc(K.label) + ' · ' + esc(placeName(it.place)) + (it.label ? ' · ' + esc(it.label) : '') + '</p>';
  const L = it.url ? linkInfo(it.url) : null;
  if (it.kind === 'prompt') {
    const marked = esc(it.text).replace(/\{\{\s*([^{}\n]+?)\s*\}\}/g, m => '<mark>' + m + '</mark>');
    b += '<pre class="prompt-view">' + marked + '</pre>';
    b += '<button type="button" class="btn p block" data-act="copy" data-id="' + it.id + '"' + (project ? ' data-proj="' + project.id + '"' : '') + ' style="margin-bottom:10px">' + ic('copy') + 'Copy prompt</button>';
  } else if (it.kind === 'note') {
    b += '<pre class="prompt-view" style="font-family:inherit">' + esc(it.text) + '</pre>';
    b += '<div class="row" style="margin-bottom:10px"><button type="button" class="btn" data-act="copy-note" data-id="' + it.id + '">' + ic('copy') + 'Copy text</button><button type="button" class="btn" data-act="to-prompt" data-id="' + it.id + '">' + ic('prompt') + 'Make it a prompt</button></div>';
  } else {
    if (it.kind === 'output' && it.files && it.files.length) b += '<div class="shots">' + it.files.map((id, n) => '<button type="button" class="shot" data-act="view-img" data-file="' + esc(id) + '" aria-label="View image ' + (n + 1) + ' full size"><img alt="" data-file="' + esc(id) + '"></button>').join('') + '</div>';
    else if (L && L.type === 'youtube' && L.thumb) b += '<div class="bigthumb"><img alt="Video thumbnail" src="' + esc(L.thumb) + '" onerror="this.remove()"></div>';
    if (it.why) b += '<div class="why">' + esc(it.why) + '</div>';
    if (L) {
      b += '<p class="url">' + esc(it.url) + '</p>';
      b += '<button type="button" class="btn p block" data-act="open" data-id="' + it.id + '" style="margin-bottom:10px">' + ic('external') + (isIOS && L.app ? 'Open in ' + esc(L.label.replace('Google ', 'Google ')) + ' app' : 'Open') + '</button>';
      if (isIOS && L.app) b += '<button type="button" class="btn block" data-act="open-browser" data-id="' + it.id + '" style="margin-bottom:10px">' + ic('world') + 'Open in browser</button>';
    }
  }
  b += '<div class="row"><button type="button" class="btn" data-act="edit" data-id="' + it.id + '">' + ic('pencil') + 'Edit</button><button type="button" class="btn" data-act="move" data-id="' + it.id + '">' + ic('move') + 'Move</button></div>' +
    '<button type="button" class="btn danger block" data-act="delete" data-id="' + it.id + '" style="margin-top:10px">' + ic('trash') + 'Delete</button>';
  openSheet(esc(titleOf(it)), b);
}
function fillSheet(it, names, pre) {
  const body = names.map((n, k) => '<div class="field"><label for="b' + k + '">' + esc(prettyBlank(n)) + '</label><input id="b' + k + '" class="inp" data-blank="' + esc(n) + '" value="' + esc(pre[n] || '') + '" autocomplete="off"></div>').join('') +
    '<div class="field"><span class="lab">Preview</span><pre class="prompt-view" id="fill-prev"></pre></div>' +
    '<div class="sticky"><button type="button" class="btn p block" id="do-copy">' + ic('copy') + 'Copy</button></div>';
  const vals = () => { const o = {}; $$('[data-blank]').forEach(e => { o[e.dataset.blank] = e.value; }); return o; };
  openSheet('Fill the blanks', body, {
    focus: names.find(n => !pre[n]) != null ? '#b' + names.findIndex(n => !pre[n]) : null,
    mount: root => {
      const prev = () => {
        const o = vals();
        $('#fill-prev', root).innerHTML = esc(it.text).replace(/\{\{\s*([^{}\n]+?)\s*\}\}/g, (m, n) => {
          const raw = Object.keys(o).find(k => esc(k) === n);
          const val = raw != null ? o[raw] : '';
          return val ? '<mark>' + esc(val) + '</mark>' : '<mark>' + m + '</mark>';
        });
      };
      $$('[data-blank]', root).forEach(e => e.addEventListener('input', prev)); prev();
      $('#do-copy', root).onclick = () => { copyText(fillPrompt(it.text, vals())); closeSheet(); toast('Copied'); };
    }
  });
}
function moveSheet(it) {
  const opts = whereOptions(it.kind).filter(o => o.place !== it.place);
  openSheet('Move to…', '<div class="where">' + opts.map(o => '<button type="button" class="wbtn ' + (o.color ? 'c-' + o.color : 'plain') + '" data-act="do-move" data-id="' + it.id + '" data-place="' + esc(o.place) + '">' + (o.place === 'inbox' ? ic('inbox') : o.project ? ic('folder') : '<span class="dot"></span>') + esc(o.label) + '</button>').join('') + '</div>');
}
function linkPicker(p) {
  const cands = S.items.filter(i => i.place.startsWith('s:')).sort((a, b) => placeName(a.place).localeCompare(placeName(b.place)) || KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind));
  if (!cands.length) { openSheet('Link from vault', '<p class="mini" style="font-size:16px">Your vault sections are empty. Add prompts, videos or links to a section first, then link them here.</p><button type="button" class="btn p block" data-act="close">OK</button>'); return; }
  const sel = new Set(p.linked || []);
  const body = '<label class="search" style="margin-bottom:10px">' + ic('search') + '<span class="sr-only">Filter</span><input id="lp-q" type="search" placeholder="Filter" autocomplete="off"></label>' +
    '<div class="list" id="lp-list">' + cands.map(i => '<button type="button" class="pick" data-id="' + i.id + '" data-s="' + esc((titleOf(i) + ' ' + (i.text || '') + ' ' + placeName(i.place)).toLowerCase()) + '" aria-pressed="' + sel.has(i.id) + '"><span class="chk">' + ic('check') + '</span><span class="txt"><span class="t" style="display:block;font-weight:650">' + esc(titleOf(i)) + '</span><span class="sub" style="font-size:14px;color:var(--muted)">' + esc(KINDS[i.kind].label + ' · ' + placeName(i.place)) + '</span></span></button>').join('') + '</div>' +
    '<div class="sticky"><button type="button" class="btn p block" id="lp-done">' + ic('check') + 'Done</button></div>';
  openSheet('Link from vault', body, { mount: root => {
    $('#lp-list', root).addEventListener('click', e => { const b = e.target.closest('.pick'); if (!b) return; const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); on ? sel.add(b.dataset.id) : sel.delete(b.dataset.id); });
    $('#lp-q', root).addEventListener('input', e => { const t = e.target.value.toLowerCase(); $$('.pick', root).forEach(b => { b.style.display = b.dataset.s.includes(t) ? '' : 'none'; }); });
    $('#lp-done', root).onclick = () => {
      const keep = (p.linked || []).filter(id => sel.has(id));
      sel.forEach(id => { if (!keep.includes(id)) keep.push(id); });
      p.linked = keep; p.updated = now(); save(); closeSheet(); render();
    };
  }});
}
function sectionSheet(s) {
  const editing = !!s;
  s = s || { name:'', color: COLORS[S.sections.length % COLORS.length] };
  addCtx = { color:s.color };
  openSheet(editing ? 'Edit section' : 'New section',
    '<div class="field"><label for="f-sname">Name</label><input id="f-sname" class="inp" placeholder="Design inspiration" value="' + esc(s.name) + '"><div class="err" id="err-sname" hidden></div></div>' +
    '<div class="field"><span class="lab" id="lab-col">Colour</span><div class="swatches" role="group" aria-labelledby="lab-col">' + COLORS.map(c => '<button type="button" class="sw c-' + c + '" data-act="form-color" data-v="' + c + '" aria-pressed="' + (s.color === c) + '" aria-label="' + c + '"></button>').join('') + '</div></div>' +
    '<div class="sticky">' + (editing ? '<button type="button" class="btn danger block" data-act="delete-section" data-id="' + esc(s.id) + '" style="margin-bottom:10px">' + ic('trash') + 'Delete section</button>' : '') +
    '<button type="button" class="btn p block" data-act="save-section"' + (editing ? ' data-id="' + esc(s.id) + '"' : '') + '>' + ic('check') + (editing ? 'Save changes' : 'Create section') + '</button></div>', { focus:'#f-sname' });
}

/* ---------- Backup ---------- */
async function buildBackup() {
  const files = {};
  const ids = new Set(S.items.flatMap(i => i.files || []));
  for (const id of ids) { const v = await loadFile(id); if (v) files[id] = v; }
  return { app:'build-vault', version:1, exportedAt:now(), state:S, files };
}
async function exportBackup() {
  try {
    const data = JSON.stringify(await buildBackup(), null, 1);
    const name = 'build-vault-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    const file = new File([data], name, { type:'application/json' });
    if (isMobile && navigator.canShare && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file], title:'Build Vault backup' }); markExported(); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    markExported();
  } catch (e) { console.error(e); toast('Export failed. Try again.'); }
}
function markExported() { S.prefs.lastExport = now(); save(); render(); toast('Backup file saved'); }
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t a Build Vault backup.'); return; }
  if (!data || data.app !== 'build-vault' || !data.state || !Array.isArray(data.state.items)) { toast('That file isn’t a Build Vault backup.'); return; }
  confirmSheet('Restore this backup?', 'Everything currently in the app will be replaced with the backup from ' + (data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'that file') + '.', 'Restore', async () => {
    try {
      await DB.clear('files'); fileCache.clear();
      for (const [id, v] of Object.entries(data.files || {})) await DB.put('files', id, v);
      S = normalize(data.state); await save(); render(); toast('Backup restored');
    } catch (e) { console.error(e); toast('Restore failed. Your backup file is unchanged.'); }
  });
}

/* ---------- Inbox paste ---------- */
async function pasteInbox() {
  let t = '';
  try { t = await navigator.clipboard.readText(); } catch (e) { t = ''; }
  if (!t || !t.trim()) { addCtx = { kind:'note', place:'inbox' }; itemForm(); toast('Couldn’t read the clipboard. Paste it here instead.'); return; }
  const m = t.match(/https?:\/\/[^\s<>"']+/i);
  const it = { id:uid(), created:now(), updated:now(), place:'inbox' };
  if (m) {
    const url = m[0].replace(/[),.]+$/, '');
    const L = linkInfo(url);
    Object.assign(it, { kind: L.type === 'youtube' ? 'video' : 'link', url, title:'', why: t.replace(m[0], '').trim().slice(0, 300) });
  } else Object.assign(it, { kind:'note', text:t, title:'' });
  S.items.push(it); save(); render(); toast('Saved to Inbox');
}

/* ---------- One click handler for the whole app ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'bg') { if (e.target === el) closeSheet(); return; }
  const acts = {
    close: closeSheet,
    add: () => addStart(),
    'add-project': () => projectForm(),
    'pick-kind': () => pickKind(el.dataset.k),
    'pick-where': () => { addCtx.place = el.dataset.place; itemForm(); },
    'back-where': () => { const k = addCtx.kind; if (contextPlace(k)) addStart(); else whereSheet(k); },
    'form-place': () => { addCtx.place = el.dataset.place; $$('[data-act="form-place"]').forEach(b => b.setAttribute('aria-pressed', b === el)); },
    'form-label': () => { const on = el.getAttribute('aria-pressed') !== 'true'; addCtx.label = on ? el.dataset.v : ''; $$('[data-act="form-label"]').forEach(b => b.setAttribute('aria-pressed', on && b === el)); },
    'form-type': () => { addCtx.type = el.dataset.v; $$('[data-act="form-type"]').forEach(b => b.setAttribute('aria-pressed', b === el)); },
    'form-status': () => { addCtx.status = el.dataset.v; $$('[data-act="form-status"]').forEach(b => b.setAttribute('aria-pressed', b === el)); },
    'form-color': () => { addCtx.color = el.dataset.v; $$('[data-act="form-color"]').forEach(b => b.setAttribute('aria-pressed', b === el)); },
    'paste-url': async () => { try { const t = await navigator.clipboard.readText(); const m = t.match(/https?:\/\/[^\s<>"']+/i); const u = $('#f-url'); u.value = m ? m[0] : t.trim(); u.dispatchEvent(new Event('input')); } catch (err) { toast('Long-press the box and choose Paste.'); $('#f-url').focus(); } },
    attach: () => $('#f-files').click(),
    'rm-shot': () => { addCtx.files.splice(+el.dataset.n, 1); renderShots(); },
    'save-item': saveItem,
    'save-project': saveProject,
    copy: () => { const it = item(id); if (it) { const p = el.dataset.proj ? proj(el.dataset.proj) : null; if ($('#sheet-root').innerHTML) closeSheet(); startCopy(it, p); } },
    'copy-note': () => { const it = item(id); if (it) { copyText(it.text); closeSheet(); toast('Copied'); } },
    'to-prompt': () => { const it = item(id); if (!it) return; it.kind = 'prompt'; if (it.place.startsWith('p:')) it.place = 'inbox'; it.updated = now(); save(); render(); detailSheet(it); toast('Now it’s a prompt'); },
    open: () => { const it = item(id); if (it) openUrl(it.url); },
    'open-browser': () => { const it = item(id); if (it) openUrl(it.url, true); },
    detail: () => { const it = item(id); if (it) detailSheet(it, el.dataset.proj ? proj(el.dataset.proj) : null); },
    edit: () => { const it = item(id); if (it) { addCtx = {}; itemForm(it); } },
    move: () => { const it = item(id); if (it) moveSheet(it); },
    'do-move': () => { const it = item(id); if (it) { it.place = el.dataset.place; it.updated = now(); save(); closeSheet(); render(); toast('Moved to ' + placeName(it.place)); } },
    delete: () => { const it = item(id); if (!it) return; closeSheet(); withUndo('Deleted', () => { S.items = S.items.filter(x => x.id !== id); S.projects.forEach(p => { if (p.linked) p.linked = p.linked.filter(x => x !== id); }); }); },
    'undo-version': () => { const it = item(id); if (!it || it.prevText == null) return; const cur = it.text; it.text = it.prevText; it.prevText = cur; it.updated = now(); save(); render(); addCtx = {}; itemForm(it); toast('Previous version restored'); },
    'view-img': async () => { const v = await loadFile(el.dataset.file); if (v) openSheet('Image', '<div class="viewer"><img alt="Saved output image" src="' + v + '"></div><button type="button" class="btn block" data-act="close">Close</button>'); },
    filter: () => { const r = route(); ui.filter[r.id] = el.dataset.k; render(); },
    'proj-status': () => { ui.projStatus = el.dataset.k; render(); },
    'set-status': () => { const p = proj(id); if (p && p.status !== el.dataset.k) { p.status = el.dataset.k; p.updated = now(); ui.projStatus = p.status; save(); render(); toast('Moved to ' + (STATUSES.find(s => s[0] === p.status) || [, ''])[1]); } },
    'edit-project': () => { const p = proj(id); if (p) projectForm(p); },
    'delete-project': () => { const p = proj(id); if (!p) return; closeSheet(); withUndo('Project deleted', () => { S.projects = S.projects.filter(x => x.id !== id); S.items = S.items.filter(i => i.place !== 'p:' + id); }); go('#/projects'); },
    'add-to-project': () => { addCtx = { kind:el.dataset.kind, place:'p:' + id }; itemForm(); },
    'link-picker': () => { const p = proj(id); if (p) linkPicker(p); },
    unlink: () => { const p = proj(el.dataset.proj); if (p) withUndo('Unlinked', () => { p.linked = (p.linked || []).filter(x => x !== id); }); },
    'new-section': () => sectionSheet(null),
    'edit-section': () => { const s = sec(id); if (s) sectionSheet(s); },
    'save-section': () => {
      const name = $('#f-sname').value.trim();
      if (!name) { showErr('err-sname', 'Give the section a name.'); $('#f-sname').focus(); return; }
      if (id) { const s = sec(id); s.name = name; s.color = addCtx.color; save(); closeSheet(); render(); toast('Saved'); }
      else { const s = { id:'s_' + uid().slice(0, 8), name, color:addCtx.color, icon:'folder' }; S.sections.push(s); save(); closeSheet(); go('#/s/' + encodeURIComponent(s.id)); toast('Section created'); }
    },
    'delete-section': () => {
      const s = sec(id); if (!s) return;
      const n = S.items.filter(i => i.place === 's:' + id).length;
      confirmSheet('Delete “' + s.name + '”?', n ? 'Its ' + plural(n, 'item') + ' will move to the Inbox, so nothing is lost.' : 'This section is empty.', 'Delete section', () => {
        withUndo('Section deleted', () => { S.sections = S.sections.filter(x => x.id !== id); S.items.forEach(i => { if (i.place === 's:' + id) i.place = 'inbox'; }); });
        go('#/');
      }, true);
    },
    'dismiss-welcome': () => { S.prefs.welcome = false; save(); render(); },
    'paste-inbox': pasteInbox,
    export: exportBackup,
    import: () => $('#import-file').click()
  };
  if (acts[a]) { e.preventDefault(); acts[a](); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; const c = $('#content'); if (c) { c.innerHTML = rootContent(route()); hydrate(c); } }
  if (e.target.id === 'pnotes') {
    const p = proj(e.target.dataset.id); if (!p) return;
    p.notes = e.target.value; p.updated = now();
    clearTimeout(window.__nt); $('#notes-saved').textContent = '';
    window.__nt = setTimeout(() => { save(); const s = $('#notes-saved'); if (s) s.textContent = 'Saved'; }, 400);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; importBackup(f); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet-root').innerHTML) closeSheet(); });
window.addEventListener('hashchange', () => { closeSheet(); render(); });

/* ---------- Start ---------- */
(async function start() {
  try {
    const st = await DB.get('kv', 'state');
    S = st ? normalize(st) : freshState();
    if (!st) await save();
  } catch (e) {
    console.error(e); storageOK = false; S = freshState();
  }
  render();
  cleanupFiles();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
